# configs/default_mimo_od.yaml

data:
  path: null
  train_ratio: 0.9
  norm_eps: 1.0e-08
  num_workers: 4

initialization:
  method: random
  num_gaussians: 100
  opacity_value: 0.01714561201362845
  scale_value: 0.47316708234696075

model:
  latent_dim: 128
  attribute_network:
    hidden_dim: 64
    num_layers: 5
    pos_enc_freqs: 32
    dropout_p: 0.11895527072152046
  contribution_decoder:
    hidden_dim: 32
    num_layers: 2
    dropout_p: 0.038806167796996166

training:
  iterations: 15000
  batch_size: 16
  stop_xyz_iter_ratio: 0.5576987840810375
  rx_noise_std: 0.03970571110929621
  lambda_activation_l1: 0.07975796732138718
  optimizer:
    eps: 2.2200759778842852e-07
    weight_decay: 4.466253410898608e-08
  learning_rate:
    position_init: 0.00010470760799401307
    position_final: 4.390295388809479e-05
    position_delay_mult: 0.01297675524333455
    rotation: 0.0005244404137812401
    scaling: 0.0014486302884826408
    attribute_net: 0.0005970116192739218
    decoder: 0.0005492022300526569
  snr_eps: 1.0e-10

experiment:
  name: grf_run
  seed: 42
  device: cuda
  log_dir: logs
  log_freq: 30
  eval_freq: 250
  checkpoint_freq: 1000
  tensorboard: false
  log_grad_stats: false
  use_custom_cuda: true

evaluation:
  batch_size: 1
  num_samples: 3
  snr_eps: 1.0e-10
  unnormalize_samples: false
