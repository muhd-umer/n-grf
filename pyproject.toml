[project]
name = "ard-r2f"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.0",
    "pymatreader>=1.0.0",
    "r2f-engine",
    "setuptools>=75.8.0",
    "simple-knn",
    "tensorboard>=2.19.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
]

[tool.uv]
config-settings = { editable_mode = "compat" }

[tool.uv.sources]
torch = { index = "pytorch-cu124", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu124", marker = "sys_platform == 'linux'" }
simple-knn = { path = "submodules/simple-knn" }
r2f-engine = { path = "r2f_engine" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
